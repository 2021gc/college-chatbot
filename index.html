<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SK College AI Chatbot</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #3b1d5a, #0b0215);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .container {
            width: 420px;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(14px);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 0 40px rgba(157,78,221,0.5);
            position: relative;
        }

        .logo {
            text-align: center;
        }

        .logo img {
            width: 90px;
            margin-bottom: 8px;
        }

        .blink-title {
            text-align: center;
            color: #c77dff;
            margin: 8px 0 2px;
        }

        .ai-status {
            text-align: center;
            font-size: 12px;
            color: #9dffb0;
            margin-bottom: 15px;
        }

        .quick-actions {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .quick-actions button {
            background: linear-gradient(135deg,#7b2cff,#c77dff);
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }

        .options-box {
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .option-btn {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: none;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }

        .option-btn:hover {
            background: rgba(199,125,255,0.4);
        }

        .chat-box {
            background: rgba(0,0,0,0.35);
            border-radius: 20px;
            padding: 15px;
            min-height: 260px;
            max-height: 330px;
            overflow-y: auto;
        }

        .you {
            background: linear-gradient(135deg,#4361ee,#4895ef);
            color: #fff;
            padding: 10px 14px;
            margin: 8px 0;
            border-radius: 18px 18px 0 18px;
            max-width: 75%;
            margin-left: auto;
        }

        .bot {
            background: linear-gradient(135deg,#9d4edd,#5a189a);
            color: #fff;
            padding: 10px 14px;
            margin: 8px 0;
            border-radius: 18px 18px 18px 0;
            max-width: 75%;
        }

        .typing {
            background: rgba(255,255,255,0.15);
            padding: 8px 14px;
            border-radius: 18px;
            display: inline-flex;
            gap: 6px;
            margin-top: 5px;
        }

        .dots span {
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            animation: blink 1.4s infinite both;
        }

        .dots span:nth-child(2){animation-delay:.2s}
        .dots span:nth-child(3){animation-delay:.4s}

        @keyframes blink {
            0% {opacity:.2}
            20% {opacity:1}
            100% {opacity:.2}
        }

        .chat-controls {
            margin-top: 10px;
            text-align: center;
        }

        input[type="text"] {
            width: 65%;
            padding: 8px;
            border-radius: 20px;
            border: none;
            outline: none;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .send-btn {
            background: linear-gradient(135deg,#7b2cff,#c77dff);
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
        }

        .speak-btn {
            background: linear-gradient(135deg,#06d6a0,#9ef01a);
            border: none;
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
        }

        .clear-btn {
            background: #ef233c;
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    
    <h3 class="blink-title">🎓 SK College AI Assistant</h3>
    <p class="ai-status">🟢 Online • Ready to Help</p>

    <div class="quick-actions">
        <button onclick="showOptions('fees')">💰 Fees</button>
        <button onclick="showOptions('courses')">🎓 Courses</button>
        <button onclick="showOptions('syllabus')">📘 Syllabus</button>
        <button onclick="showOptions('facilities')">🏫 Facilities</button>
    </div>

    <div id="optionsBox" class="options-box"></div>

    <div class="chat-box" id="chatBox">
        <div class="bot">🤖 Hello! How can I help you today?</div>

        {% for sender, msg in chat_history %}
            {% if sender == "You" %}
                <div class="you">👤 {{ msg }}</div>
            {% else %}
                <div class="bot">🤖 {{ msg }}</div>
            {% endif %}
        {% endfor %}

        <div id="typingIndicator" class="typing" style="display:none;">
            🤖 <div class="dots"><span></span><span></span><span></span></div>
        </div>
    </div>

    <form method="post" class="chat-controls" onsubmit="return handleSubmit(event)">
        <input type="text" id="user_input" name="user_input" placeholder="Ask your question..." required>
        <div class="btn-group">
            <button type="submit" class="send-btn">Send</button>
            <button type="button" class="speak-btn" id="speakBtn">🎤</button>
        </div>
    </form>

    <form method="post">
        <input type="hidden" name="action" value="clear">
        <button class="clear-btn">🧹 Clear Chat</button>
    </form>

</div>

<script>
const chatBox = document.getElementById("chatBox");
const typingIndicator = document.getElementById("typingIndicator");

function handleSubmit(e){
    e.preventDefault();
    typingIndicator.style.display="inline-flex";
    setTimeout(()=>e.target.submit(),700);
}

function showOptions(type){
    const box=document.getElementById("optionsBox");
    let opts=[];
    if(type==="fees") opts=["BSc IT Fees","BCom Fees","BA Fees"];
    if(type==="courses") opts=["BSc IT","BCom","BA"];
    if(type==="syllabus") opts=["BSc IT Syllabus","BCom Syllabus","BA Syllabus"];
    if(type==="facilities") opts=["Library","Computer Lab","Transport","Hostel","WiFi","Medical"];

    box.innerHTML="";
    opts.forEach(o=>{
        box.innerHTML+=`<button class="option-btn" onclick="sendOption('${o}')">${o}</button>`;
    });
    box.style.display="flex";
}

function sendOption(text){
    document.getElementById("user_input").value=text;
    document.querySelector(".chat-controls").submit();
}
</script>

<script>
const speakBtn=document.getElementById("speakBtn");

if('webkitSpeechRecognition' in window){
    const rec=new webkitSpeechRecognition();
    rec.lang="en-US";
    rec.onresult=e=>{
        document.getElementById("user_input").value=e.results[0][0].transcript;
        document.querySelector(".send-btn").click();
    };
    speakBtn.onclick=()=>rec.start();
}else{
    speakBtn.disabled=true;
    speakBtn.textContent="❌";
}
</script>
<script>
window.onload = function () {
    const chatBox = document.getElementById("chatBox");
    chatBox.scrollTo({
        top: chatBox.scrollHeight,
        behavior: "smooth"
    });
};
</script>

</body>
</html>
