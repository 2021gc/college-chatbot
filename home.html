<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>S.K College AI Chatbot</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(180deg,#2a0a4a,#0b0215);
    font-family: "Segoe UI", sans-serif;
}

/* ===== MOBILE FRAME ===== */
.mobile{
    width:360px;
    height:680px;
    border-radius:34px;
    overflow:hidden;
    box-shadow:0 0 80px rgba(157,78,221,.45);
    position:relative;

    background: url("{{ url_for('static', filename='bot.jpg') }}") center center no-repeat;
    background-size: cover;

    display:flex;
    flex-direction:column;
    justify-content:flex-end;
}

/* Dark overlay */
.mobile::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to top, rgba(0,0,0,0.75), transparent 60%);
}

/* ===== CONTENT ===== */
.content{
    position:relative;
    z-index:2;
    padding: 0 20px 100px;   /* 🔥 THIS moves text UP */
    text-align:center;
    color:white;
}

h2{
    margin-bottom:20px;
    font-size:22px;
}

/* ===== BUTTON ===== */
.start{
    display:block;
    width:100%;
    box-sizing:border-box;   /* 🔥 IMPORTANT FIX */
    background:white;
    color:#3c096c;
    padding:14px;
    border-radius:16px;
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
}


.start:hover{
    background:#c77dff;
    color:white;
}
</style>
</head>

<body>

<div class="mobile">

    <div class="content">
        <h2>S.K Assistant Here!</h2>
        <a href="/chat" class="start">Get Started</a>
    </div>

</div>

</body>
</html>
