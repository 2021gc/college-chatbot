<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>S.K College AI Chatbot</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #3b1d5a, #0b0215);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.container {
    width: 85%;
    max-width: 1100px;
    display: flex;
    gap: 30px;
}

/* LEFT PANEL */
.left {
    width: 30%;
    background: rgba(255,255,255,0.06);
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 0 40px rgba(128,0,255,0.3);
}

.left img {
    width: 120px;
    margin-bottom: 20px;
}

.left h2 {
    color: #c77dff;
}

.left p {
    font-size: 14px;
    opacity: 0.9;
}

.start-btn {
    margin-top: 30px;
    display: inline-block;
    padding: 14px 30px;
    border-radius: 30px;
    background: linear-gradient(135deg,#7b2cff,#c77dff);
    color: white;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
}

.start-btn:hover {
    transform: scale(1.08);
}

/* CENTER PANEL */
.center {
    width: 40%;
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    padding: 30px;
}

.center h3 {
    margin-bottom: 20px;
    color: #d6b3ff;
}

.topic {
    background: rgba(255,255,255,0.08);
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 12px;
}

/* RIGHT PANEL */
.right {
    width: 30%;
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    padding: 30px;
    text-align: center;
}

.voice-circle {
    width: 180px;
    height: 180px;
    margin: auto;
    border-radius: 50%;
    background: radial-gradient(circle, #9d4edd, #3c096c);
    box-shadow: 0 0 60px #9d4edd;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
}
</style>
</head>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="center">
        <h2>Meet CollegeBot 🤖</h2>
        <p>Your AI assistant for admissions, fees, exams and campus life.</p>
        <a href="/chat" class="start-btn">Get Started</a>
    </div>

    <!-- CENTER -->
    <div class="center">
        <h3>Features</h3>
        <div class="topic">🎓Admission Process</div>
        <div class="topic">💰 Fees & Scholarship</div>
        <div class="topic">📘 Syllabus</div>
        <div class="topic">🕒 Timetable</div>
        <div class="topic">🏢 Placements</div>
    </div>

    <!-- RIGHT -->
    <div class="right">
        <h3>Voice Assistant</h3>
        <p>Go ahead, I’m listening...</p>
        <div class="voice-circle">🎤</div>
    </div>

</div>

</body>
</html>
